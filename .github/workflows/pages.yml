name: Build and publish SAMA report
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install report packages
        run: Rscript -e 'install.packages(c("rmarkdown", "knitr", "readxl", "dplyr", "tidyr", "ggplot2", "writexl"))'
      - name: Render index.html
        run: |
          mkdir -p _site
          Rscript -e 'rmarkdown::render("SAMA_Report.Rmd", output_file="index.html", output_dir="_site")'
          cp -r SAMA_2026_Project _site/results
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
